<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Billo</title>
    <meta name="description" content="Split a restaurant bill at the table. Scan the receipt, everyone picks their items, and pay the person who covered it. No signup." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Billo" />
    <meta property="og:description" content="Split a restaurant bill at the table. Scan the receipt, everyone picks their items, and pay the person who covered it. No signup." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Billo" />
    <meta name="twitter:description" content="Split a restaurant bill at the table. Scan the receipt, everyone picks their items, and pay the person who covered it. No signup." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#f6f1e7" />
    <script>(function(){try{var t=localStorage.getItem('billo-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}var d=document.documentElement;d.dataset.theme=t;d.classList.toggle('dark',t==='dark');var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#141217':'#f6f1e7'}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
